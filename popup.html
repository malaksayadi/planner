<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Popup Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 40px;
        background-color: #f5f5f5;
      }

      .box {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 10px;
        display: inline-block;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        position: relative;
      }

      .btn {
        margin-left: 15px;
        padding: 10px 14px;
        border: none;
        background-color: #4caf50;
        color: white;
        border-radius: 50%;
        font-size: 18px;
        cursor: pointer;
      }

      .popup-overlay {
        display: none; /* Hidden by default */
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .popup-box {
        background-color: white;
        padding: 30px;
        border-radius: 8px;
        width: 300px;
        max-width: 90%;
        position: relative;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
      }

      .close-btn {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 22px;
        color: #888;
        cursor: pointer;
      }

      .close-btn:hover {
        color: #000;
      }
    </style>
  </head>
  <body>
    <!-- Boîte avec le bouton + -->
    <div class="box">
      <span>Personal Goals</span>
      <button class="btn" id="openPopupBtn">+</button>
    </div>

    <!-- Popup (caché au début) -->
    <div class="popup-overlay" id="popup">
      <div class="popup-box">
        <span class="close-btn" id="closePopupBtn">&times;</span>
        <h3>Ajouter un objectif personnel</h3>
        <!-- Contenu du popup -->
        <p>Ici, tu peux ajouter un objectif…</p>
      </div>
    </div>

    <!-- JavaScript -->
    <script>
      const openPopupBtn = document.getElementById("openPopupBtn");
      const closePopupBtn = document.getElementById("closePopupBtn");
      const popup = document.getElementById("popup");

      openPopupBtn.addEventListener("click", function () {
        popup.style.display = "flex";
      });

      closePopupBtn.addEventListener("click", function () {
        popup.style.display = "none";
      });

      // Clique en dehors de la boîte pour fermer
      window.addEventListener("click", function (e) {
        if (e.target === popup) {
          popup.style.display = "none";
        }
      });
    </script>
  </body>
</html>
